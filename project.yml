# Xcode project definition; regenerate with `xcodegen generate`.
name: Skerry
options:
  bundleIdPrefix: com.dcadolph
  createIntermediateGroups: true
packages:
  SkerryPackage:
    path: .
targets:
  SkerryMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Skerry
      - path: Sources/ShareCommon
    dependencies:
      - package: SkerryPackage
        product: SkerryKit
      - target: SkerryShareMac
      - target: SkerryWidgetsMac
    scheme:
    entitlements:
      path: SkerryMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.device.audio-input: true
        com.apple.security.application-groups:
          - U7L4P2YHWJ.com.dcadolph.skerry
    info:
      path: SkerryMac-Info.plist
      properties:
        CFBundleDisplayName: Skerry
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Skerry records audio memos that are transcribed on your device.
        NSSpeechRecognitionUsageDescription: Skerry transcribes audio entirely on your device. Nothing is sent anywhere.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.dcadolph.skerry
            CFBundleURLSchemes:
              - skerry
    settings:
      base:
        PRODUCT_NAME: Skerry
        PRODUCT_BUNDLE_IDENTIFIER: com.dcadolph.skerry
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: 0.24.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
  SkerryiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Skerry
      - path: Sources/ShareCommon
    dependencies:
      - package: SkerryPackage
        product: SkerryKit
      - target: SkerryShareiOS
      - target: SkerryWidgetsiOS
      - target: SkerryWatch
    scheme:
    entitlements:
      path: SkerryiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dcadolph.skerry
    info:
      path: SkerryiOS-Info.plist
      properties:
        CFBundleDisplayName: Skerry
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSFaceIDUsageDescription: Skerry uses Face ID to unlock locked notes.
        NSCameraUsageDescription: Skerry uses the camera to turn a photo of text into a note.
        NSPhotoLibraryUsageDescription: Skerry reads a photo you pick to turn its text into a note.
        NSMicrophoneUsageDescription: Skerry records audio memos that are transcribed on your device.
        NSSpeechRecognitionUsageDescription: Skerry transcribes audio entirely on your device. Nothing is sent anywhere.
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.dcadolph.skerry.sync
        UIBackgroundModes:
          - fetch
        CFBundleURLTypes:
          - CFBundleURLName: com.dcadolph.skerry
            CFBundleURLSchemes:
              - skerry
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Skerry
        PRODUCT_BUNDLE_IDENTIFIER: com.dcadolph.skerry
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U7L4P2YHWJ
        MARKETING_VERSION: 0.24.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  SkerryShareMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/SkerryShare
      - path: Sources/ShareCommon
    entitlements:
      path: SkerryShareMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - U7L4P2YHWJ.com.dcadolph.skerry
    info:
      path: SkerryShareMac-Info.plist
      properties:
        CFBundleDisplayName: Skerry
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 6
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dcadolph.skerry.share
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: 0.24.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: true
  SkerryShareiOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SkerryShare
      - path: Sources/ShareCommon
    entitlements:
      path: SkerryShareiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dcadolph.skerry
    info:
      path: SkerryShareiOS-Info.plist
      properties:
        CFBundleDisplayName: Skerry
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 6
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dcadolph.skerry.share
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U7L4P2YHWJ
        MARKETING_VERSION: 0.24.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
  SkerryWidgetsMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/SkerryWidgets
      - path: Sources/ShareCommon
    entitlements:
      path: SkerryWidgetsMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - U7L4P2YHWJ.com.dcadolph.skerry
    info:
      path: SkerryWidgetsMac-Info.plist
      properties:
        CFBundleDisplayName: Skerry Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dcadolph.skerry.widgets
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: 0.24.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: true
  SkerryWidgetsiOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SkerryWidgets
      - path: Sources/ShareCommon
    entitlements:
      path: SkerryWidgetsiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dcadolph.skerry
    info:
      path: SkerryWidgetsiOS-Info.plist
      properties:
        CFBundleDisplayName: Skerry Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dcadolph.skerry.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U7L4P2YHWJ
        MARKETING_VERSION: 0.24.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
  SkerryWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/SkerryWatch
    info:
      path: SkerryWatch-Info.plist
      properties:
        CFBundleDisplayName: Skerry
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dcadolph.skerry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dcadolph.skerry.watchkitapp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U7L4P2YHWJ
        MARKETING_VERSION: 0.24.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true
