<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Skerry</title>
<meta property="og:title" content="Skerry">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #08080a;
    --bg-glow: #121216;
    --fg: #f3f1ec;
    --dim: #7c766d;
    --beak: #e58150;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f1ea;
      --bg-glow: #ffffff;
      --fg: #1b1a1f;
      --dim: #7c766d;
      --beak: #c0603c;
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    background-image: radial-gradient(ellipse 90% 60% at 50% 0%, var(--bg-glow), var(--bg) 70%);
    color: var(--fg);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    text-align: center;
    animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  img {
    width: min(180px, 42vw);
    height: auto;
    display: block;
    border-radius: 50%;
  }

  p {
    margin: 0;
    font-size: clamp(1.15rem, 1rem + 1.1vw, 1.6rem);
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1.5;
    max-width: 22ch;
    text-wrap: balance;
  }

  .mark {
    display: block;
    width: 2rem;
    height: 2px;
    border-radius: 2px;
    background: var(--beak);
    opacity: 0.85;
  }

  footer {
    position: fixed;
    bottom: 1.75rem;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <img src="skelly.png" alt="Skerry">
    <span class="mark"></span>
    <p>Looking for the perfect little island.</p>
  </main>
  <footer>Skerry</footer>
</body>
</html>
